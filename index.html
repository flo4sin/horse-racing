<html>
<head>
  <base target="_blank">
  <title>Eagletcraft 1.12 Launcher</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #121212; color: white; font-family: Arial, sans-serif; }
    #container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .play-button { 
      padding: 20px 40px; background: #000; color: #fff; border: 2px solid #4a148c; 
      border-radius: 10px; font: bold 24px Arial; cursor: pointer; z-index: 1001; 
      transition: background 0.3s;
    }
    .play-button:hover { background: #4a148c; }

    .fullscreen-button { 
      padding: 10px 15px; background: #000; color: #fff; border: 2px solid #4a148c; 
      border-radius: 5px; font: bold 14px Arial; cursor: pointer; position: fixed; 
      bottom: 20px; right: 20px; z-index: 1002; 
    }
    .fullscreen-button:hover { background: #4a148c; }

    #fr { display: none; width: 100%; height: 100%; border: none; }
    
    .status-msg { margin-top: 20px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

<div id="container">
  <iframe id="fr" allowfullscreen=""></iframe>
  <button id="mainPlayBtn" class="play-button" type="button" onclick="PlayTo(this)">PLAY REGULAR</button>
  <div id="status" class="status-msg">Attempting undetectable auto-launch...</div>
  <button class="fullscreen-button" type="button" onclick="openFullscreen()">OPEN UNDETECTABLE</button>
</div>

<script>
  const DB_NAME = 'GameCacheDB';
  const STORE_NAME = 'GameFiles';
  const CACHE_DURATION = 90 * 24 * 60 * 60 * 1000; 
  const FILE_URL = 'https://cdn.jsdelivr.net/gh/PlanetDogeCodes/Eagletcraft-1.12@main/source%20file/egc1-12.xml';

  // Placeholder for missing function in original snippet
  function showAdOnClick() { console.log("Interaction detected."); }

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        db.createObjectStore(STORE_NAME, { keyPath: 'url' });
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function saveToCache(url, content) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put({ url: url, content: content, timestamp: Date.now() });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(new Error('Cache error'));
    });
  }

  async function getFileFromCache(url) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.get(url);
      request.onsuccess = async (event) => {
        const data = event.target.result;
        if (data && (Date.now() - data.timestamp) < CACHE_DURATION) {
          resolve(data.content);
        } else {
          try {
            const response = await fetch(url);
            const text = await response.text();
            await saveToCache(url, text);
            resolve(text);
          } catch (err) {
            reject(err);
          }
        }
      };
      request.onerror = () => reject(new Error('DB error'));
    });
  }

  function PlayTo(button) {
    const iframe = document.getElementById("fr");
    const status = document.getElementById("status");
    getFileFromCache(FILE_URL).then((text) => {
      iframe.contentDocument.open();
      iframe.contentDocument.write(text);
      iframe.contentDocument.close();
      iframe.style.display = "block";
      button.style.display = "none";
      status.style.display = "none";

      iframe.contentWindow.document.addEventListener('pointerdown', showAdOnClick);
      iframe.contentWindow.document.addEventListener('touchstart', showAdOnClick);
    }).catch((err) => {
      console.error('Error:', err);
      alert('An error was detected. Error Code: -21345');
    });
  }

  function openFullscreen() {
    getFileFromCache(FILE_URL).then((text) => {
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.open();
        newWindow.document.write(text);
        newWindow.document.close();
        
        newWindow.document.addEventListener('pointerdown', showAdOnClick);
        newWindow.document.addEventListener('touchstart', showAdOnClick);
        
        // Update status if successful
        document.getElementById("status").innerText = "Undetectable window launched.";
      } else {
        document.getElementById("status").innerText = "Auto-launch blocked. Please click manually.";
        console.warn('Pop-up blocked.');
      }
    }).catch((err) => {
      console.error('Error:', err);
      alert('Tam ekran yüklenemedi.');
    });
  }

  // AUTO-LAUNCH LOGIC
  window.addEventListener('load', () => {
    // Small delay to ensure browser environment is ready
    setTimeout(() => {
      openFullscreen();
    }, 1000);
  });
</script>
</body>
</html>
