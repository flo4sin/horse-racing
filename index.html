<!-- Updated index.txt with new features -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dave's Horse Racing</title>
<style>
  /* ... (keep your existing styles here, omitted for brevity) ... */

  /* Additional styles for highscore and reset button */
  #highscoreContainer {
    margin-top: 10px;
    font-size: 1.2rem;
    color: #ffd700;
  }
  #resetBtn {
    margin-top: 10px;
    padding: 10px 20px;
    background: #ff4444;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #resetBtn:hover {
    background: #ff2222;
  }
</style>
</head>
<body>

<a href="https://davescasino.github.io/davescasino" class="back-hub">⬅ Back to Hub</a>

<h1 class="casino-header">Dave's Horse Racing</h1>

<div id="highscoreContainer">Highscore: $0</div>
<button id="resetBtn">Reset Game</button>

<div class="game-container">
  <canvas id="raceTrack" width="1000" height="500"></canvas>
  <div id="resultOverlay">
    <div id="resultTitle">Winner!</div>
    <div id="resultMessage">Horse #3 took the gold.</div>
    <button id="closeOverlayBtn">CONTINUE</button>
    <div class="hint" style="margin-top:15px">(Or Press Space)</div>
  </div>
</div>

<!-- New: Bet amount input -->
<div class="ui-panel" style="margin-top: 10px;">
  <label for="betAmount" style="margin-right:8px;">Bet Amount ($):</label>
  <input type="number" id="betAmount" min="1" max="10000" value="10000" style="width:80px; padding:8px; font-size:14px;">
  <div class="balance-box">💰 <span id="balance">10000</span></div>
  <select id="horseSelect">
    <option value="0">#1 Red Rocket</option>
    <option value="1">#2 Blue Bolt</option>
    <option value="2">#3 Gold Gallop</option>
    <option value="3">#4 Silver Streak</option>
  </select>
  <button id="startBtn">PLACE BET</button>
</div>
<div class="hint">Tip: Press <b>SPACEBAR</b> to Bet/Confirm</div>

<script>
const canvas = document.getElementById('raceTrack');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const horseSelect = document.getElementById('horseSelect');
const balanceEl = document.getElementById('balance');
const betAmountInput = document.getElementById('betAmount');

const highscoreContainer = document.getElementById('highscoreContainer');
const resetBtn = document.getElementById('resetBtn');

const resultOverlay = document.getElementById('resultOverlay');
const resultTitle = document.getElementById('resultTitle');
const resultMessage = document.getElementById('resultMessage');
const closeOverlayBtn = document.getElementById('closeOverlayBtn');

let balance = 10000;
let highscore = 0;
let racing = false;
let overlayVisible = false;
let startTime = null;
let canBet = true; 
const raceDuration = 12000;
let currentBetAmount = 10000;

const horseData = [
  { id: 0, color: '#ff4444', label: '1' },
  { id: 1, color: '#4444ff', label: '2' },
  { id: 2, color: '#ffd700', label: '3' },
  { id: 3, color: '#ffffff', label: '4' }
];

let horses = [];
let finalAngles = []; // for winner fix

// Load horse sprites (optional, for now, keep as simple shapes)
let horseImages = [];

function loadHorseSprites() {
  for (let i=0; i<horseData.length; i++) {
    let img = new Image();
    // You can replace the src with your sprite URLs
    img.src = 'https://via.placeholder.com/30x15/ffd700/000000?text=H'+(i+1);
    horseImages.push(img);
  }
}

// Initialize the game
function init() {
  loadHorseSprites();
  initHorses();
  updateHighscore();
}

function initHorses() {
  horses = horseData.map((h, i) => ({
    ...h,
    angle: 1.5 * Math.PI,
    rx: 300 + (i * 30),
    ry: 120 + (i * 25),
    phaseShift: Math.random() * 10,
    speedMult: 0.985 + (Math.random() * 0.035)
  }));
  finalAngles = horses.map(h => h.angle);
}

function drawTrack() {
  ctx.fillStyle = "#5d4037";
  ctx.beginPath(); ctx.ellipse(500, 250, 450, 250, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 2;
  for(let i=0; i<6; i++) {
    ctx.beginPath(); ctx.ellipse(500, 250, 285+(i*30), 108+(i*25), 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(500, 15); ctx.lineTo(500, 142); ctx.stroke();
}

function drawHorse(h) {
  const x = 500 + Math.cos(h.angle) * h.rx;
  const y = 250 + Math.sin(h.angle) * h.ry;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(h.angle + Math.PI/2);
  // Draw sprite if loaded
  if (horseImages[h.id]) {
    ctx.drawImage(horseImages[h.id], -15, -7);
  } else {
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = (h.color === '#ffffff' || h.color === '#ffd700') ? "#000" : "#fff";
    ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
    ctx.fillText(h.label, 0, 4);
  }
  ctx.restore();
}

function renderAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTrack();
  horses.forEach(drawHorse);
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(elapsed / raceDuration, 1);

  horses.forEach((h, i) => {
    if (progress < 1) {
      const suspense = Math.sin(progress * 12 + h.phaseShift) * 0.012;
      const smoothProgress = Math.max(0, (progress * h.speedMult) + suspense);
      h.angle = (1.5 * Math.PI) + (smoothProgress * Math.PI * 2);
    } else {
      // Final position
      h.angle = (1.5 * Math.PI) + (h.speedMult * Math.PI * 2);
    }
  });

  renderAll();

  if (progress < 1) {
    requestAnimationFrame(animate);
  } else {
    finishRace();
  }
}

function finishRace() {
  // Determine final angles
  finalAngles = horses.map(h => h.angle);
  // Find the horse with the maximum angle (which looks like the winner)
  const maxAngle = Math.max(...finalAngles);
  const winnerIndex = finalAngles.indexOf(maxAngle);
  const winner = horses[winnerIndex];

  const betOn = parseInt(horseSelect.value);
  const isWin = (winner.id === betOn);
  const betAmount = currentBetAmount;

  if (isWin) {
    const payout = betAmount * 5; // or any multiplier
    balance += payout;
    if (balance > highscore) {
      highscore = balance;
      updateHighscore();
    }
    resultTitle.innerText = "🏆 YOU WON!";
    resultTitle.className = "win-text";
    resultMessage.innerText = `Horse #${winner.label} came in first. Dave pays out $${payout}!`;
  } else {
    resultTitle.innerText = "💸 YOU LOST";
    resultTitle.className = "lose-text";
    resultMessage.innerText = `Horse #${winner.label} won the race. Better luck next time!`;
  }
  balanceEl.innerText = balance;

  setTimeout(() => {
    resultOverlay.style.display = "block";
    overlayVisible = true;
  }, 500);
}

function updateHighscore() {
  document.getElementById('highscoreContainer').innerText = `Highscore: $${highscore}`;
}

function handleBet() {
  if (racing || !canBet || overlayVisible) return;
  const betAmount = parseInt(betAmountInput.value, 10);
  if (isNaN(betAmount) || betAmount < 1) {
    alert("Enter a valid bet amount!");
    return;
  }
  if (balance < betAmount) {
    alert("Not enough balance!");
    return;
  }
  canBet = false;
  startBtn.blur();
  horseSelect.disabled = true;
  startBtn.disabled = true;

  balance -= betAmount;
  balanceEl.innerText = balance;
  currentBetAmount = betAmount;
  initHorses();
  startTime = null;
  requestAnimationFrame(animate);
}

function closeOverlay() {
  resultOverlay.style.display = "none";
  overlayVisible = false;
  racing = false;
  startBtn.disabled = false;
  horseSelect.disabled = false;
  startTime = null;
  initHorses();
  renderAll();
  setTimeout(() => { canBet = true; }, 300);
}

function resetGame() {
  balance = 10000;
  if (balance > highscore) highscore = balance;
  updateHighscore();
  document.getElementById('balance').innerText = balance;
  initHorses();
  renderAll();
}

document.getElementById('resetBtn').addEventListener('click', resetGame);

window.addEventListener('keydown', (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    if (overlayVisible) {
      closeOverlay();
    } else {
      handleBet();
    }
  }
});

loadHorseSprites();
init();

</script>
</body>
</html>
