<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dave Coins Idle Game</title>
<style>
body {
  background: linear-gradient(to right, #ffcc00, #ff6600);
  font-family: 'Arial', sans-serif;
  margin: 0;
  padding: 20px;
  text-align: center;
  color: #fff;
}
h1 {
  font-size: 2em;
  margin-bottom: 10px;
}
#dave {
  width: 300px;
  cursor: pointer;
  border-radius: 20px;
  border: 5px solid #fff;
  box-shadow: 0 0 20px #fff;
  transition: transform 0.1s;
  margin-top: 10px;
}
#dave:hover {
  transform: scale(1.05);
}
#stats {
  margin-top: 20px;
  font-size: 1.2em;
}
#money {
  font-size: 2em;
  margin: 10px 0;
}
#upgrades {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  background: #fff;
  color: #ff6600;
  border: none;
  padding: 10px 20px;
  margin: 10px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 10px #fff;
  font-size: 1em;
  transition: background 0.3s;
}
button:hover {
  background: #ffcc00;
}
#buildings {
  margin-top: 20px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}
.building {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 10px;
  margin: 10px;
  flex: 1 1 200px;
  max-width: 250px;
}
.building h3 {
  margin-top: 0;
}
</style>
</head>
<body>

<h1>Dave Coins - Idle Clicker</h1>
<!-- Your provided Dave image -->
<img src="https://i.imgur.com/1UfrW92.png" id="dave" alt="Dave" />

<div id="stats">
  <div>Dave Coins: <span id="money">0</span></div>
  <div>Coins per Click: <span id="perClick">1</span></div>
  <div>Auto Coins/sec: <span id="autoCoins">0</span></div>
  <div>Prestige Multiplier: <span id="prestigeMultiplier">1</span></div>
  <div>Prestige Threshold: <span id="prestigeThreshold"></span></div>
</div>

<div id="buildings"></div>

<div id="upgrades">
  <button id="clickUpgrade">Increase Click (+1) ($10)</button>
  <button id="autoUpgrade">Add Auto Coin (+1/sec) ($50)</button>
  <button id="prestigeBtn">Prestige (Reset & Gain Multiplier)</button>
</div>

<script>
// Persistent data
let data = JSON.parse(localStorage.getItem('daveCoinsData')) || {
  money: 0,
  coinsPerClick: 1,
  autoCoinsPerSec: 0,
  prestigeMultiplier: 1,
  prestigeCount: 0,
  buildings: {
    farmer: { count: 0, cost: 10, baseCost: 10, rate: 1, unlocked: false },
    tractor: { count: 0, cost: 100, baseCost: 100, rate: 10, unlocked: false },
  }
};

// Initial prestige threshold
let prestigeThreshold = 1000;

// Elements
const moneySpan = document.getElementById('money');
const perClickSpan = document.getElementById('perClick');
const autoCoinsSpan = document.getElementById('autoCoins');
const prestigeSpan = document.getElementById('prestigeMultiplier');
const prestigeThresholdSpan = document.getElementById('prestigeThreshold');

const dave = document.getElementById('dave');
const btnClickUpgrade = document.getElementById('clickUpgrade');
const btnAutoUpgrade = document.getElementById('autoUpgrade');
const btnPrestige = document.getElementById('prestigeBtn');
const buildingsDiv = document.getElementById('buildings');

// Buildings data
const buildingTypes = [
  {
    key: 'farmer',
    name: 'Amish Farmer',
    baseCost: 10,
    rate: 1,
    unlockPrestige: 1, // unlock after 1 prestige
  },
  {
    key: 'tractor',
    name: 'Bright Orange Tractor',
    baseCost: 100,
    rate: 10,
    unlockPrestige: 2, // unlock after 2 prestiges
  },
];

// Save data
function save() {
  localStorage.setItem('daveCoinsData', JSON.stringify(data));
}

// Update display
function update() {
  // Apply prestige multiplier
  const totalMoney = data.money * data.prestigeMultiplier;
  moneySpan.innerText = totalMoney.toFixed(2);
  perClickSpan.innerText = data.coinsPerClick;
  autoCoinsSpan.innerText = getTotalAutoIncome().toFixed(2);
  prestigeSpan.innerText = data.prestigeMultiplier;
  prestigeThresholdSpan.innerText = prestigeThreshold;
  updateBuildingsUI();
}

// Calculate total auto income
function getTotalAutoIncome() {
  let total = 0;
  for (const b of buildingTypes) {
    const bData = data.buildings[b.key];
    if (bData.unlocked) {
      total += bData.count * b.rate;
    }
  }
  return total * data.prestigeMultiplier;
}

// Clicking Dave
dave.addEventListener('click', () => {
  data.money += data.coinsPerClick;
  animateCoins();
  update();
});

// Animate coins flying
function animateCoins() {
  for (let i=0; i<10; i++) {
    const coin = document.createElement('div');
    coin.innerText = '🪙';
    coin.style.position = 'absolute';
    coin.style.left = dave.offsetLeft + 'px';
    coin.style.top = dave.offsetTop + 'px';
    coin.style.fontSize = '24px';
    coin.style.opacity = 1;
    document.body.appendChild(coin);
    const targetX = window.innerWidth*Math.random();
    const targetY = window.innerHeight*Math.random();
    const duration = 1000 + Math.random()*500;
    const startTime = performance.now();

    function animate() {
      const elapsed = performance.now() - startTime;
      if (elapsed > duration) {
        document.body.removeChild(coin);
        return;
      }
      const progress = elapsed / duration;
      coin.style.left = (dave.offsetLeft + (targetX - dave.offsetLeft) * progress) + 'px';
      coin.style.top = (dave.offsetTop + (targetY - dave.offsetTop) * progress) + 'px';
      coin.style.opacity = 1 - progress;
      requestAnimationFrame(animate);
    }
    animate();
  }
}

// Buy building
function buyBuilding(bKey) {
  const bConfig = buildingTypes.find(b => b.key === bKey);
  const bData = data.buildings[bKey];
  if (!bData.unlocked) {
    alert('This building is locked! Prestige first.');
    return;
  }
  // Cost scales exponentially
  const cost = bData.cost;
  if (data.money >= cost) {
    data.money -= cost;
    bData.count++;
    // Increase cost exponentially
    bData.cost = Math.round(bData.cost * 1.15);
    update();
  } else {
    alert('Not enough Dave Coins!');
  }
}

// UI for buildings
function updateBuildingsUI() {
  document.querySelector('#buildings').innerHTML = '';
  for (const b of buildingTypes) {
    const bData = data.buildings[b.key];
    // Check unlock condition
    if (bData.unlocked) {
      const div = document.createElement('div');
      div.className = 'building';
      div.innerHTML = `
        <h3>${b.name}</h3>
        <div>Owned: ${bData.count}</div>
        <div>Cost: $${bData.cost}</div>
        <div>Produces: ${(bData.rate * bData.count)} coins/sec</div>
        <button onclick="buyBuilding('${b.key}')">Buy ${b.name}</button>
      `;
      document.querySelector('#buildings').appendChild(div);
    }
  }
}

// Event listeners for upgrades
btnClickUpgrade.onclick = () => {
  if (data.money >= 10) {
    data.money -= 10;
    // Increase the amount of click each time
    data.coinsPerClick += 1;
    update();
  } else {
    alert('Not enough Dave Coins!');
  }
};

let autoUpgradeCost = 50; // initial cost
btnAutoUpgrade.onclick = () => {
  if (data.money >= autoUpgradeCost) {
    data.money -= autoUpgradeCost;
    data.autoCoinsPerSec++;
    // Increase cost for next purchase
    autoUpgradeCost = Math.round(autoUpgradeCost * 1.25);
    update();
  } else {
    alert('Not enough Dave Coins!');
  }
};

btnPrestige.onclick = () => {
  if (data.money >= prestigeThreshold) {
    // Calculate how many times you can prestige
    const gainedMultiplier = Math.floor(data.money / prestigeThreshold);
    data.prestigeMultiplier += gainedMultiplier;
    data.prestigeCount += gainedMultiplier;

    // Reset progress
    data.money = 0;
    data.coinsPerClick = 1;
    data.autoCoinsPerSec = 0;

    // Reset buildings
    for (const b of Object.keys(data.buildings)) {
      data.buildings[b].count = 0;
    }

    // Increase prestige threshold for next time
    prestigeThreshold = Math.round(prestigeThreshold * 1.5);
    alert(`Prestiged! Multiplier increased by ${gainedMultiplier}.`);
    update();
  } else {
    alert(`Earn at least ${prestigeThreshold} Dave Coins to prestige.`);
  }
};

// Auto coins per second
setInterval(() => {
  let totalAuto = 0;
  for (const b of buildingTypes) {
    const bData = data.buildings[b.key];
    if (bData.unlocked) {
      totalAuto += bData.count * b.rate;
    }
  }
  data.money += totalAuto * data.prestigeMultiplier;
  update();
}, 1000);

// Unlock buildings based on prestige count
function checkBuildingUnlocks() {
  for (const b of buildingTypes) {
    if (b.unlockPrestige <= data.prestigeCount) {
      data.buildings[b.key].unlocked = true;
    }
  }
}

// Load from local storage
function load() {
  if (localStorage.getItem('daveCoinsData')) {
    data = JSON.parse(localStorage.getItem('daveCoinsData'));
  }
}
load();

// Initialize unlocks
checkBuildingUnlocks();
update();

// Save periodically
setInterval(() => {
  save();
  checkBuildingUnlocks();
}, 5000);
</script>

</body>
</html>
