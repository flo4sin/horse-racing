<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Black Dave's Horse Racing</title>
<!-- Tailwind for utility styles -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  body {
    font-family: 'Inter', sans-serif;
    background-color: #1a202c;
    color: #e2e8f0;
    overflow-x: hidden;
  }

  a.back-hub {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background: #333;
    color: #ffd700;
    border-radius: 5px;
    font-weight: bold;
    border: 1px solid #ffd700;
    z-index: 9999;
    transition: 0.3s;
  }

  a.back-hub:hover {
    background: #ffd700;
    color: #000;
    box-shadow: 0 0 10px #ffd700;
  }

  #game-container {
    max-width: 1000px;
    margin: 80px auto 20px auto;
    position: relative;
  }

  /* Canvas styling */
  #raceTrack {
    background: #2d3748;
    border: 8px solid #3e2723;
    border-radius: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    width: 100%;
    height: 500px;
  }

  /* Overlay styling */
  #resultOverlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    border: 4px solid #ffd700;
    border-radius: 20px;
    padding: 30px;
    width: 80%;
    max-width: 400px;
    display: none;
    z-index: 100;
    box-shadow: 0 0 50px rgba(0,0,0,1);
  }

  #resultTitle {
    font-size: 28px; margin-bottom: 10px; text-transform: uppercase;
  }
  #resultMessage {
    font-size: 18px; margin-bottom: 20px;
  }
  .win-text {
    color: #ffd700; text-shadow: 0 0 10px #ffd700;
  }
  .lose-text {
    color: #ff4444;
  }

  /* Betting panel style */
  #betPanel {
    background: rgba(0,0,0,0.9);
    border: 2px solid #ffd700;
    border-radius: 15px;
    padding: 15px;
    max-width: 600px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  /* Bet amount slider styles */
  #betSliderContainer {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #betAmountDisplay {
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 10px;
  }
  #betSlider {
    width: 80%;
  }

  /* Other controls styling */
 #horseSelect {
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    outline: none;
    cursor: pointer;
    background: #fff;
    width: 100%;
    max-width: 200px;
  }

  #placeBetBtn {
    background: linear-gradient(#ffd700, #b8860b);
    color: #000;
    font-weight: bold;
    padding: 15px 25px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    width: 100%;
    max-width: 200px;
    font-size: 16px;
  }
  #placeBetBtn:disabled {
    background: #555;
    color: #888;
    cursor: not-allowed;
  }

  /* Reset button style */
  #resetBtn {
    margin-top: 10px;
    padding: 10px 20px;
    background: #555;
    color: #fff;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  #resetBtn:hover {
    background: #ffd700;
    color: #000;
  }

  /* Tip text style */
  .tip {
    margin-top: 10px;
    color: #aaa;
    font-size: 12px;
  }

  /* Highscore box style */
  #highscoreBox {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
    border: 3px solid #ffd700;
    border-radius: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.5);
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 0 10px #ffd700;
    text-align: center;
  }

</style>
</head>
<body>

<a href="https://davescasino.github.io/davescasino" class="back-hub">⬅ Back to Hub</a>

<h1 class="text-4xl font-black text-center text-yellow-400 mt-20 mb-4">BLACK DAVE HORSE RACING</h1>

<!-- Highscore display -->
<div id="highscoreBox">Highscore: 0</div>

<!-- Reset button -->
<div style="margin-top:10px; display:flex; justify-content:center;">
  <button id="resetBtn">Reset Game</button>
</div>

<!-- Canvas container -->
<div id="canvasContainer" style="position:relative; margin-top:20px;">
  <canvas id="raceTrack" width="1000" height="500"></canvas>
  <!-- Result overlay -->
  <div id="resultOverlay" class="flex items-center justify-center">
    <div class="text-center">
      <div id="resultTitle"></div>
      <div id="resultMessage" class="mt-2"></div>
      <button id="continueBtn" class="mt-4 px-4 py-2 bg-yellow-500 rounded font-bold hover:bg-yellow-600">CONTINUE</button>
    </div>
  </div>
</div>

<!-- Betting controls -->
<div id="betPanel">
  <div class="flex flex-col items-center w-full">
    <div class="text-3xl font-extrabold text-yellow-300 mb-4">BET AMOUNT</div>
    <div id="betAmountDisplay">$10</div>
    <div id="betSliderContainer">
      <input type="range" id="betSlider" min="1" max="1000" value="10" />
    </div>
  </div>
  <div class="flex flex-col items-center w-full mt-4">
    <div class="mb-2">Select Horse:</div>
    <select id="horseSelect">
      <option value="0">#1 Red Rocket</option>
      <option value="1">#2 Blue Bolt</option>
      <option value="2">#3 Gold Gallop</option>
      <option value="3">#4 Silver Streak</option>
      <option value="4">#5 Purple Power</option>
    </select>
  </div>
  <div class="flex justify-center mt-4 w-full">
    <button id="placeBetBtn">PLACE BET</button>
  </div>
  <div class="tip text-center mt-2">Tip: Use slider to select bet amount. Press SPACE to Bet/Confirm.</div>
</div>

<script>
const canvas = document.getElementById('raceTrack');
const ctx = canvas.getContext('2d');

const highscoreBox = document.getElementById('highscoreBox');
const resetBtn = document.getElementById('resetBtn');
const resultOverlay = document.getElementById('resultOverlay');
const resultTitle = document.getElementById('resultTitle');
const resultMessage = document.getElementById('resultMessage');
const continueBtn = document.getElementById('continueBtn');

const betSlider = document.getElementById('betSlider');
const betAmountDisplay = document.getElementById('betAmountDisplay');
const horseSelect = document.getElementById('horseSelect');
const placeBetBtn = document.getElementById('placeBetBtn');

let balance = 2000;
let highscore = localStorage.getItem('blackjackHighScore') || 0;
highscore = parseInt(highscore);
if (isNaN(highscore)) highscore = 0;
highscoreBox.innerText = 'Highscore: ' + highscore;

let racing = false;
let overlayVisible = false;
let startTime = null;
let canBet = true;
const raceDuration = 12000;

const horseData = [
  { id: 0, color: '#ff4444', label: '1' },
  { id: 1, color: '#4444ff', label: '2' },
  { id: 2, color: '#ffd700', label: '3' },
  { id: 3, color: '#ffffff', label: '4' },
  { id: 4, color: '#bb44ff', label: '5' }
];

let horses = [];
let currentBet = 10;

function initHorses() {
  horses = horseData.map((h, i) => ({
    ...h,
    angle: 1.5 * Math.PI,
    rx: 300 + (i * 30),
    ry: 120 + (i * 25),
    phaseShift: Math.random() * 10,
    speedMult: 0.985 + (Math.random() * 0.035)
  }));
}
initHorses();

// Draw track
function drawTrack() {
  ctx.fillStyle = "#5d4037";
  ctx.beginPath();
  ctx.ellipse(500, 250, 450, 250, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.ellipse(500, 250, 285 + i * 30, 108 + i * 25, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(500, 15);
  ctx.lineTo(500, 142);
  ctx.stroke();
}

function drawHorse(h) {
  const x = 500 + Math.cos(h.angle) * h.rx;
  const y = 250 + Math.sin(h.angle) * h.ry;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(h.angle + Math.PI / 2);
  ctx.fillStyle = h.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = (h.color === '#ffffff' || h.color === '#ffd700') ? "#000" : "#fff";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText(h.label, 0, 4);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTrack();
  horses.forEach(drawHorse);
}

function animate(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;
  const progress = Math.min(elapsed / raceDuration, 1);

  horses.forEach(h => {
    if (progress < 1) {
      const suspense = Math.sin(progress * 12 + h.phaseShift) * 0.012;
      const smoothProgress = Math.max(0, (progress * h.speedMult) + suspense);
      h.angle = (1.5 * Math.PI) + (smoothProgress * Math.PI * 2);
    } else {
      h.angle = (1.5 * Math.PI) + (h.speedMult * Math.PI * 2);
    }
  });
  render();
  if (progress < 1) {
    requestAnimationFrame(animate);
  } else {
    finishRace();
  }
}

function finishRace() {
  const betOn = horseSelect.value;
  const winner = horses.reduce((a, b) => a.angle > b.angle ? a : b);
  const isWin = winner.id == betOn;
  const betAmount = currentBet;

  if (isWin) {
    const payout = betAmount * 5;
    balance += payout;
    resultTitle.innerText = "🏆 YOU WON!";
    resultTitle.className = "win-text";
    resultMessage.innerText = `Horse #${winner.label} took the gold! You win $${payout}!`;
    if (balance > highscore) {
      highscore = balance;
      localStorage.setItem('blackjackHighScore', highscore);
      highscoreBox.innerText = 'Highscore: ' + highscore;
    }
  } else {
    resultTitle.innerText = "💸 YOU LOST";
    resultTitle.className = "lose-text";
    resultMessage.innerText = `Horse #${winner.label} won the race. Better luck next time!`;
  }
  document.querySelector('#balanceSpan').innerText = balance;
  document.querySelector('#balanceSpan').innerText = balance;

  setTimeout(() => {
    document.getElementById('resultOverlay').style.display = 'flex';
    overlayVisible = true;
    // Reset betting state
    canBet = true;
    startBtn.disabled = false;
    horseSelect.disabled = false;
  }, 500);
}

function closeOverlay() {
  document.getElementById('resultOverlay').style.display = 'none';
  overlayVisible = false;
  racing = false;
  startBtn.disabled = false;
  horseSelect.disabled = false;
  startTime = null;
  initHorses();
  render();
  // Re-enable betting
  canBet = true;
}

// Handle Bet
function handleBet() {
  if (racing || !canBet || overlayVisible) return;

  const betAmt = parseInt(betSlider.value);
  if (isNaN(betAmt) || betAmt < 1) {
    alert("Invalid bet amount");
    return;
  }
  if (balance < betAmt) {
    alert("Out of cash!");
    return;
  }
  balance -= betAmt;
  currentBet = betAmt;
  document.querySelector('#balanceSpan').innerText = balance;

  // Disable controls during race
  canBet = false;
  startBtn.disabled = true;
  horseSelect.disabled = true;

  requestAnimationFrame(animate);
}

document.getElementById('continueBtn').onclick = () => {
  document.getElementById('resultOverlay').style.display = 'none';
  overlayVisible = false;
  racing = false;
  startBtn.disabled = false;
  horseSelect.disabled = false;
  startTime = null;
  initHorses();
  render();
  // Re-enable betting
  canBet = true;
};

// Event listeners
document.getElementById('resetBtn').onclick = () => {
  balance = 2000;
  localStorage.setItem('blackjackHighScore', 0);
  highscore = 0;
  highscoreBox.innerText = 'Highscore: ' + highscore;
  document.querySelector('#balanceSpan').innerText = balance;
  initHorses();
  render();
  document.getElementById('resultOverlay').style.display = 'none';
  overlayVisible = false;
  racing = false;
  canBet = true;
};

document.getElementById('placeBetBtn').onclick = handleBet;

document.getElementById('continueBtn').onclick = () => {
  closeOverlay();
};

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (overlayVisible) {
      closeOverlay();
    } else {
      handleBet();
    }
  }
});

// Slider update
betSlider.oninput = () => {
  betAmountDisplay.innerText = '$' + betSlider.value;
};
betSlider.value = 10;
betAmountDisplay.innerText = '$10';

</script>
</body>
</html>
