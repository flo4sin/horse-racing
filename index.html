<html>
<head>
  <base target="_blank">
  <title>Eagletcraft 1.12</title>
</head>
<body>
<div id="container">
  <button class="main-button" type="button" onclick="openFullscreen()">OPEN UNDETECTABLE</button>
</div>

<style>
  body, html { 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    height: 100%; 
    background-color: #121212; /* Dark background for a cleaner look */
  }

  #container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .main-button { 
    padding: 25px 50px; 
    background: #000; 
    color: #fff; 
    border: 3px solid #4a148c; 
    border-radius: 12px; 
    font: bold 26px Arial; 
    cursor: pointer; 
    transition: transform 0.2s, background 0.3s;
  }

  .main-button:hover { 
    background: #4a148c; 
    transform: scale(1.05);
  }
</style>

<script>
  const DB_NAME = 'GameCacheDB';
  const STORE_NAME = 'GameFiles';
  const CACHE_DURATION = 90 * 24 * 60 * 60 * 1000; 
  const FILE_URL = 'https://cdn.jsdelivr.net/gh/PlanetDogeCodes/Eagletcraft-1.12@main/source%20file/egc1-12.xml';

  // Dummy function to prevent errors from the original event listeners
  function showAdOnClick() { console.log("Interaction recorded."); }

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        db.createObjectStore(STORE_NAME, { keyPath: 'url' });
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function saveToCache(url, content) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put({ url: url, content: content, timestamp: Date.now() });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(new Error('Cache error'));
    });
  }

  async function getFileFromCache(url) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.get(url);
      request.onsuccess = async (event) => {
        const data = event.target.result;
        if (data && (Date.now() - data.timestamp) < CACHE_DURATION) {
          resolve(data.content);
        } else {
          try {
            const response = await fetch(url);
            const text = await response.text();
            await saveToCache(url, text);
            resolve(text);
          } catch (err) {
            reject(err);
          }
        }
      };
      request.onerror = () => reject(new Error('DB error'));
    });
  }

  function openFullscreen() {
    const btn = document.querySelector('.main-button');
    btn.innerText = "LOADING...";
    btn.style.opacity = "0.5";

    getFileFromCache(FILE_URL).then((text) => {
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.open();
        newWindow.document.write(text);
        newWindow.document.close();

        newWindow.document.addEventListener('pointerdown', showAdOnClick);
        newWindow.document.addEventListener('touchstart', showAdOnClick);
        
        btn.innerText = "OPEN UNDETECTABLE";
        btn.style.opacity = "1";
      } else {
        alert('Pop-up blocked! Please allow pop-ups for this site to launch.');
        btn.innerText = "OPEN UNDETECTABLE";
        btn.style.opacity = "1";
      }
    }).catch((err) => {
      console.error('Error:', err);
      alert('Failed to load game file.');
      btn.innerText = "OPEN UNDETECTABLE";
      btn.style.opacity = "1";
    });
  }
</script>
</body>
</html>
