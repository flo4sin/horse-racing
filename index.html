<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dave's Horse Racing</title>
<style>
body { 
    background: radial-gradient(circle, #1a3c1a 0%, #0a1a0a 100%); 
    color: #fff; font-family: 'Segoe UI', sans-serif; 
    margin: 0; padding: 10px; 
    overflow-x: hidden;
}
.back-hub {
    position: relative; display: inline-block; margin: 10px 0 20px 0;
    padding: 10px 15px; background: #333; color: #ffd700;
    text-decoration: none; border-radius: 5px; font-weight: bold;
    border: 1px solid #ffd700; z-index: 9999; transition: 0.3s;
}
@media (min-width: 768px) {
    .back-hub { position: absolute; top: 20px; left: 20px; margin: 0; }
}
.back-hub:hover { background: #ffd700; color: #000; box-shadow: 0 0 10px #ffd700; }
.casino-header { 
    text-shadow: 0 0 10px #ffd700; border-bottom: 2px solid #ffd700; 
    display: inline-block; padding-bottom: 10px; margin-bottom: 20px; 
    font-size: 1.5rem;
}
/* Container for the canvas to help position the overlay */
.game-container {
    position: relative;
    margin: 0 auto;
    max-width: 1000px;
}
canvas { 
    background: #2e7d32; border: 8px solid #3e2723; border-radius: 40px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin: 0 auto; 
    display: block; width: 100%; height: auto;
}
/* NEW: Custom Result Overlay */
#resultOverlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.95);
    border: 4px solid #ffd700;
    border-radius: 20px;
    padding: 30px;
    width: 80%;
    max-width: 400px;
    display: none; /* Hidden by default */
    z-index: 100;
    box-shadow: 0 0 50px rgba(0,0,0,1);
}
#resultTitle { font-size: 28px; margin-bottom: 10px; text-transform: uppercase; }
#resultMessage { font-size: 18px; margin-bottom: 20px; }
.win-text { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
.lose-text { color: #ff4444; }
/* UI Panel for bet controls and buttons at bottom of screen */
#bottomControls {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 999;
}
#bottomControls button {
    padding: 10px 15px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
#bottomControls button:hover {
    background: #ffd700;
    color: #000;
}
#betInput {
    width: 80px;
    padding: 8px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
#tipText {
    margin-left: 10px;
    font-size: 14px;
    color: #ccc;
}
#highscoreDisplay {
    margin-top: 20px;
    font-size: 24px; /* Bigger font for prominence */
    color: #ffd700;
    font-weight: bold;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    border: 3px solid #ffd700;
    border-radius: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.5);
    text-align: center;
    box-shadow: 0 0 10px #ffd700;
}
@media (max-width: 480px) {
    #bottomControls {
        flex-direction: column;
        width: 100%;
        bottom: 10px;
        left: 0;
        transform: none;
        border-top: 1px solid #ffd700;
        border-radius: 0 0 10px 10px;
    }
    #bottomControls button {
        width: 100%;
    }
}
</style>
</head>
<body>

<a href="https://davescasino.github.io/davescasino" class="back-hub">⬅ Back to Hub</a>

<h1 class="casino-header">Dave's Horse Racing</h1>

<!-- Highscore display -->
<div id="highscoreDisplay">Highscore: 0</div>

<!-- Canvas and overlay -->
<div class="game-container">
    <canvas id="raceTrack" width="1000" height="500"></canvas>
    <div id="resultOverlay">
        <div id="resultTitle">Winner!</div>
        <div id="resultMessage">Horse #3 took the gold.</div>
        <button id="closeOverlayBtn">CONTINUE</button>
        <div class="hint" style="margin-top:15px">(Or Press Space)</div>
    </div>
</div>

<!-- Bottom controls: Bet, Reset, Tip -->
<div id="bottomControls">
    <input type="number" id="betInput" min="1" max="1000" value="10" />
    <span id="tipText">Tip: Press SPACEBAR to Bet/Confirm</span>
    <button id="placeBetBtn">PLACE BET</button>
    <button id="resetBtn">Reset Game</button>
</div>

<script>
// Variables
const canvas = document.getElementById('raceTrack');
const ctx = canvas.getContext('2d');

const placeBetBtn = document.getElementById('placeBetBtn');
const resetBtn = document.getElementById('resetBtn');
const betInput = document.getElementById('betInput');
const highscoreDisplay = document.getElementById('highscoreDisplay');

const resultOverlay = document.getElementById('resultOverlay');
const resultTitle = document.getElementById('resultTitle');
const resultMessage = document.getElementById('resultMessage');
const closeOverlayBtn = document.getElementById('closeOverlayBtn');

let balance = 2000;
let highscore = localStorage.getItem('horseHighscore') || 0;
highscoreDisplay.innerText = 'Highscore: ' + highscore;

let racing = false;
let overlayVisible = false;
let startTime = null;
let canBet = true;
const raceDuration = 12000;

const horseData = [
    { id: 0, color: '#ff4444', label: '1' },
    { id: 1, color: '#4444ff', label: '2' },
    { id: 2, color: '#ffd700', label: '3' },
    { id: 3, color: '#ffffff', label: '4' },
    { id: 4, color: '#bb44ff', label: '5' }
];

let horses = [];
let currentBetAmount = 10;

function initHorses() {
    horses = horseData.map((h, i) => ({
        ...h,
        angle: 1.5 * Math.PI,
        rx: 300 + (i * 30),
        ry: 120 + (i * 25),
        phaseShift: Math.random() * 10,
        speedMult: 0.985 + (Math.random() * 0.035)
    }));
}

function drawTrack() {
    ctx.fillStyle = "#5d4037";
    ctx.beginPath(); ctx.ellipse(500, 250, 450, 250, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 2;
    for(let i=0; i<6; i++) {
        ctx.beginPath(); ctx.ellipse(500, 250, 285+(i*30), 108+(i*25), 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(500, 15); ctx.lineTo(500, 142); ctx.stroke();
}

function drawHorse(h) {
    const x = 500 + Math.cos(h.angle) * h.rx;
    const y = 250 + Math.sin(h.angle) * h.ry;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(h.angle + Math.PI/2);
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = (h.color === '#ffffff' || h.color === '#ffd700') ? "#000" : "#fff";
    ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
    ctx.fillText(h.label, 0, 4);
    ctx.restore();
}

function renderAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTrack();
    horses.forEach(drawHorse);
}

function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / raceDuration, 1);
    horses.forEach(h => {
        if (progress < 1) {
            const suspense = Math.sin(progress * 12 + h.phaseShift) * 0.012;
            const smoothProgress = Math.max(0, (progress * h.speedMult) + suspense);
            h.angle = (1.5 * Math.PI) + (smoothProgress * Math.PI * 2);
        } else {
            h.angle = (1.5 * Math.PI) + (h.speedMult * Math.PI * 2);
        }
    });
    renderAll();
    if (progress < 1) {
        requestAnimationFrame(animate);
    } else {
        finishRace();
    }
}

function finishRace() {
    const betOn = horseSelect.value;
    const winner = horses.reduce((a, b) => a.angle > b.angle ? a : b);
    const isWin = winner.id == betOn;
    const betAmount = currentBetAmount;

    if (isWin) {
        const payout = betAmount * 5;
        balance += payout;
        resultTitle.innerText = "🏆 YOU WON!";
        resultTitle.className = "win-text";
        resultMessage.innerText = `Horse #${winner.label} came in first. Dave pays out $${payout}!`;
        if (balance > highscore) {
            highscore = balance;
            localStorage.setItem('horseHighscore', highscore);
            highscoreDisplay.innerText = 'Highscore: ' + highscore;
        }
    } else {
        resultTitle.innerText = "💸 YOU LOST";
        resultTitle.className = "lose-text";
        resultMessage.innerText = `Horse #${winner.label} won the race. Better luck next time!`;
    }
    document.getElementById('balance').innerText = balance;
    setTimeout(() => {
        resultOverlay.style.display = "block";
        overlayVisible = true;
        // Re-enable reset button after race
        resetBtn.disabled = false;
    }, 500);
}

function closeOverlay() {
    resultOverlay.style.display = "none";
    overlayVisible = false;
    racing = false;
    startBtn.disabled = false;
    horseSelect.disabled = false;
    startTime = null;
    initHorses();
    renderAll();
    resetBtn.disabled = false;
}

// Handle Bet
function handleBet() {
    if (racing || !canBet || overlayVisible) return;
    const betAmount = parseInt(betInput.value, 10);
    if (isNaN(betAmount) || betAmount < 1) {
        showCustomPopup("Invalid Bet", "Please enter a bet amount of at least $1.");
        return;
    }
    if (balance < betAmount) {
        resultTitle.innerText = "OUT OF CASH";
        resultTitle.className = "lose-text";
        resultMessage.innerText = "Dave doesn't give loans. Come back when you're loaded!";
        resultOverlay.style.display = "block";
        overlayVisible = true;
        return;
    }
    // Disable reset during race
    resetBtn.disabled = true;
    canBet = false;
    startBtn.blur();
    horseSelect.disabled = true;
    startBtn.disabled = true;
    balance -= betAmount;
    document.getElementById('balance').innerText = balance;
    currentBetAmount = betAmount;
    racing = true;
    requestAnimationFrame(animate);
}

// Show custom popup for invalid input
function showCustomPopup(title, message) {
    let popup = document.getElementById('customPopup');
    if (!popup) {
        popup = document.createElement('div');
        popup.id = 'customPopup';
        popup.style.position = 'fixed';
        popup.style.top = '50%';
        popup.style.left = '50%';
        popup.style.transform = 'translate(-50%, -50%)';
        popup.style.background = 'rgba(0,0,0,0.95)';
        popup.style.border = '4px solid #ffd700';
        popup.style.borderRadius = '20px';
        popup.style.padding = '30px';
        popup.style.zIndex = '9999';
        popup.style.maxWidth = '400px';
        popup.style.width = '80%';
        popup.style.boxShadow = '0 0 50px rgba(0,0,0,1)';
        document.body.appendChild(popup);
    }
    popup.innerHTML = `
        <div style="font-size:24px; margin-bottom:15px; text-align:center;">${title}</div>
        <div style="font-size:18px; margin-bottom:20px; color:#ccc; text-align:center;">${message}</div>
        <button style="background:linear-gradient(#ffd700,#b8860b); padding:10px 20px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" id="popupCloseBtn">OK</button>
    `;
    popup.style.display = 'block';
    document.getElementById('popupCloseBtn').onclick = () => {
        popup.style.display = 'none';
    };
}

// Move the reset button to bottom controls (already done)

// Attach event listeners
document.getElementById('resetBtn').addEventListener('click', () => {
    balance = 2000;
    highscore = 0;
    localStorage.setItem('horseHighscore', highscore);
    highscoreDisplay.innerText = 'Highscore: ' + highscore;
    document.getElementById('balance').innerText = balance;
    initHorses();
    renderAll();
    resultOverlay.style.display = "none";
    overlayVisible = false;
    racing = false;
    canBet = true;
    startTime = null;
    resetBtn.disabled = false;
});
document.getElementById('closeOverlayBtn').addEventListener('click', () => {
    closeOverlay();
});
document.getElementById('placeBetBtn').addEventListener('click', handleBet);

// Spacebar handler
window.addEventListener('keydown', (e) => {
    if (e.code === "Space") {
        e.preventDefault();
        if (overlayVisible) {
            closeOverlay();
        } else {
            handleBet();
        }
    }
});

// Initialize scene
initHorses();
renderAll();
</script>
</body>
</html>
