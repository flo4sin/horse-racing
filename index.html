<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dave Clicker Idle Game</title>
<style>
body {
  background: linear-gradient(to right, #ffcc00, #ff6600);
  font-family: 'Arial', sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  color: #fff;
}
h1 {
  font-size: 2em;
  margin-bottom: 10px;
}
#dave {
  width: 300px;
  cursor: pointer;
  border-radius: 20px;
  border: 5px solid #fff;
  box-shadow: 0 0 20px #fff;
  transition: transform 0.1s;
}
#dave:hover {
  transform: scale(1.05);
}
#stats {
  margin-top: 20px;
  font-size: 1.2em;
}
#money {
  font-size: 2em;
  margin: 10px 0;
}
#upgrades {
  margin-top: 20px;
}
button {
  background: #fff;
  color: #ff6600;
  border: none;
  padding: 10px 20px;
  margin: 10px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 10px #fff;
  font-size: 1em;
  transition: background 0.3s;
}
button:hover {
  background: #ffcc00;
}
</style>
</head>
<body>

<h1>Dave Clicker Idle Game</h1>
<!-- Replace the src with your provided image -->
<img src="https://i.imgur.com/your_image_link_here.jpg" id="dave" alt="Dave" />

<div id="stats">
  <div>Money: $<span id="money">0</span></div>
  <div>Money per Click: $<span id="perClick">1</span></div>
  <div>Auto Income: $<span id="autoIncome">0</span> / sec</div>
</div>

<div id="upgrades">
  <button id="clickUpgrade">Increase Click Value ($10)</button>
  <button id="autoUpgrade">Increase Auto Income ($50)</button>
</div>

<script>
// Copy the previous game script here
let money = 0;
let moneyPerClick = 1;
let autoIncome = 0;

const moneySpan = document.getElementById('money');
const perClickSpan = document.getElementById('perClick');
const autoIncomeSpan = document.getElementById('autoIncome');

const dave = document.getElementById('dave');
const clickUpgradeBtn = document.getElementById('clickUpgrade');
const autoUpgradeBtn = document.getElementById('autoUpgrade');

function updateDisplay() {
  moneySpan.innerText = money.toFixed(2);
  perClickSpan.innerText = moneyPerClick.toFixed(2);
  autoIncomeSpan.innerText = autoIncome.toFixed(2);
}

dave.addEventListener('click', () => {
  money += moneyPerClick;
  updateDisplay();
});

clickUpgradeBtn.addEventListener('click', () => {
  if (money >= 10) {
    money -= 10;
    moneyPerClick += 1;
    updateDisplay();
  } else {
    alert('Not enough money to upgrade!');
  }
});

autoUpgradeBtn.addEventListener('click', () => {
  if (money >= 50) {
    money -= 50;
    autoIncome += 1;
    updateDisplay();
  } else {
    alert('Not enough money to upgrade auto income!');
  }
});

setInterval(() => {
  money += autoIncome;
  updateDisplay();
}, 1000);

updateDisplay();
</script>

</body>
</html>
