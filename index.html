<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DAVE POKER</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle,#1b2a44,#0d1626);
    color:white;
}

.game{
    width:1100px;
    margin:30px auto;
    background:#2a3548;
    border-radius:12px;
    padding:15px;
    box-shadow:0 0 30px rgba(0,0,0,.6);
}

.header{
    text-align:center;
}

.header h1{
    margin:0;
    color:gold;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:5px;
}

.tableArea{
    display:flex;
    justify-content:space-between;
    padding:20px;
    min-height:320px;
}

.players{
    display:flex;
    gap:50px;
}

.player{
    text-align:center;
    position:relative;
}

.cards{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.card{
    width:70px;
    height:100px;
    background:white;
    color:black;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

.red{
    color:red;
}

.potArea{
    text-align:center;
    width:200px;
}

.potCircle{
    width:120px;
    height:120px;
    background:gold;
    color:black;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    margin:auto;
}

.controls{
    display:flex;
    gap:15px;
    justify-content:center;
    margin-top:10px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.bet{background:#1f9c45;color:white;}
.check{background:#2d63d6;color:white;}
.fold{background:#d62d2d;color:white;}
.next{background:#e0b000;color:black;}

.glow{
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 5px gold;}
    50%{box-shadow:0 0 25px gold;}
    100%{box-shadow:0 0 5px gold;}
}

.hintBar{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
}

.toggle{
    cursor:pointer;
}

.floating{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:-20px;
    color:gold;
    animation:floatUp 2s forwards;
}

@keyframes floatUp{
    0%{opacity:1;top:20px;}
    100%{opacity:0;top:-40px;}
}

.chip{
    position:absolute;
    width:20px;
    height:20px;
    background:gold;
    border-radius:50%;
}

.helpBtn{
    position:absolute;
    right:20px;
    bottom:20px;
    background:#444;
}

.helpMenu{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1e2633;
    padding:20px;
    border-radius:10px;
    width:500px;
    display:none;
}

</style>
</head>
<body>

<div class="game">

<div class="header">
<h1>DAVE POKER</h1>
<div class="stats">
<div>Chips: $<span id="chips">1900</span></div>
<div>High: $2150</div>
</div>
</div>

<div class="tableArea">

<div class="players">

<div class="player" id="you">
YOU
<div class="cards" id="youCards"></div>
</div>

<div class="player" id="dave">
DAVE
<div class="cards" id="daveCards"></div>
</div>

<div class="player" id="bot">
BOT
<div class="cards" id="botCards"></div>
</div>

</div>

<div class="potArea">

<div class="potCircle" id="pot">
$300
</div>

<div>POT</div>

</div>

</div>

<div class="controls">

<button class="bet" id="betBtn">BET 100</button>

<button class="check" id="checkBtn">CHECK</button>

<button class="fold" id="foldBtn">FOLD</button>

<button class="next" id="nextBtn">NEXT</button>

</div>

<div class="hintBar">

<div>
Hints
<input type="checkbox" id="hintToggle" checked>
</div>

<div id="hintText">
Press NEXT to reveal cards
</div>

</div>

</div>

<button class="helpBtn" onclick="toggleHelp()">HELP</button>

<div class="helpMenu" id="helpMenu">

<h2>HOW TO PLAY</h2>

<p>
This is a simplified poker game.
</p>

<p>
BET adds chips to the pot.
CHECK passes turn.
FOLD exits round.
NEXT progresses the game.
</p>

<p>
Hints highlight what to press next.
</p>

<button onclick="toggleHelp()">Close</button>

</div>

<script>

let suits=["♠","♥","♦","♣"]
let values=["A","K","Q","J","10","9","8","7"]

let pot=300
let chips=1900

let hints=true
let lastHint="Press NEXT to reveal cards"

function randomCard(){

let value=values[Math.floor(Math.random()*values.length)]
let suit=suits[Math.floor(Math.random()*suits.length)]

return value+suit

}

function drawCards(){

draw("youCards")
draw("daveCards")
draw("botCards")

}

function draw(id){

let div=document.getElementById(id)
div.innerHTML=""

for(let i=0;i<2;i++){

let c=randomCard()

let el=document.createElement("div")

el.className="card"

if(c.includes("♥")||c.includes("♦"))
el.classList.add("red")

el.innerText=c

div.appendChild(el)

}

}

drawCards()

function updatePot(){

document.getElementById("pot").innerText="$"+pot

}

function updateChips(){

document.getElementById("chips").innerText=chips

}

function floating(player,text){

let p=document.getElementById(player)

let f=document.createElement("div")

f.className="floating"

f.innerText=text

p.appendChild(f)

setTimeout(()=>f.remove(),2000)

}

function chipAnim(){

let chip=document.createElement("div")

chip.className="chip"

chip.style.left="200px"
chip.style.top="300px"

document.body.appendChild(chip)

chip.animate([
{transform:"translate(0,0)"},
{transform:"translate(600px,-200px)"}
],1000)

setTimeout(()=>chip.remove(),1000)

}

function botTurn(player){

setHint(player+" thinking...")

setTimeout(()=>{

let action=["CHECK","BET","FOLD"][Math.floor(Math.random()*3)]

floating(player.toLowerCase(),action)

if(action=="BET"){

pot+=100
chipAnim()
updatePot()

}

setHint(player+" "+action)

highlight("nextBtn")

},1500)

}

function setHint(text){

lastHint=text

if(hints)
document.getElementById("hintText").innerText=text

}

function highlight(id){

document.querySelectorAll("button").forEach(b=>b.classList.remove("glow"))

if(hints)
document.getElementById(id).classList.add("glow")

}

document.getElementById("hintToggle").onchange=function(){

hints=this.checked

if(hints)
document.getElementById("hintText").innerText=lastHint
else
document.getElementById("hintText").innerText="Hints disabled"

}

document.getElementById("betBtn").onclick=function(){

chips-=100
pot+=100

updatePot()
updateChips()

chipAnim()

floating("you","BET")

setHint("Dave's turn")

botTurn("Dave")

}

document.getElementById("checkBtn").onclick=function(){

floating("you","CHECK")

setHint("Dave's turn")

botTurn("Dave")

}

document.getElementById("foldBtn").onclick=function(){

floating("you","FOLD")

setHint("Round ended")

}

document.getElementById("nextBtn").onclick=function(){

setHint("Bot turn")

botTurn("Bot")

}

highlight("nextBtn")

function toggleHelp(){

let m=document.getElementById("helpMenu")

m.style.display=
m.style.display=="block"?
"none":"block"

}

</script>

</body>
</html>
